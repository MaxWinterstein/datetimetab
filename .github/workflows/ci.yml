name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: Pages deploys only after CI on main succeeds,
  # so a cancelled run there means a merged commit that never ships.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both job names are required status checks on main (branch protection), and
# Renovate automerges only when every required check is green. Renaming a job
# means updating the protection rule too, or automerge waits forever.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token lying in .git/config
          # for npm install scripts or hooks to find.
          persist-credentials: false

      # Node, task and prek at exactly the versions in mise.toml, the same file
      # a contributor installs from -- one pin per tool instead of a copy here
      # that updates had to find. mise verifies the aqua downloads' checksums.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Tests
        run: node --test "test/*.test.mjs"

      # The site build verifies every relative import, href and src in dist/
      # resolves, which a plain copy step cannot: a missing module 404s and
      # kills the whole page while leaving CI green.
      - name: Site builds and its links resolve
        run: node tools/build-web.mjs

      # Everything the local hooks enforce -- YAML validity, merge markers,
      # oversized files, whitespace. Without this, those only ever run on
      # machines that happen to have prek installed.
      - name: Hooks
        run: prek run --all-files --show-diff-on-failure

  # The vibepod overlay pins its own copies of gh, task and prek, and nothing
  # else ever builds it: without this job an automerged bump there would only
  # be found broken on the next pod start. The overlay is a FROM-less fragment
  # appended to VibePod's agent image, so it is built here on the Debian
  # release that image uses, with the two things the fragment expects.
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the overlay and run every tool it installs
        run: |
          {
            echo 'FROM debian:bookworm-slim'
            echo 'RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*'
            cat .vibepod/overlay/Dockerfile
          } > "$RUNNER_TEMP/Dockerfile"
          docker build -f "$RUNNER_TEMP/Dockerfile" -t overlay .vibepod/overlay
          docker run --rm overlay sh -c 'set -eux; gh --version; task --version; prek --version; chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<title>ok</title>" | grep -q "<title>ok</title>"'
