# The toolchain, for `mise install` (https://mise.jdx.dev) and for CI, which
# installs from this same file (jdx/mise-action), so a version here is the
# version everything runs. Exact pins on purpose: a floating "22" would let
# CI change Node under us without a pull request; pinned, every bump is a
# Renovate PR that has to pass CI first.
#
# task and prek are also pinned in .vibepod/overlay/aqua.yaml;
# test/docs.test.mjs keeps the two in step and renovate.json updates them
# together.
[tools]
node = "24.21.0"
"aqua:go-task/task" = "3.53.1"
"aqua:j178/prek" = "0.5.4"
